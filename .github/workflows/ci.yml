name: Validate themes

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: python -m pip install PyYAML==6.0.2

      - name: Regenerate theme files
        run: |
          python3 yasb/generate.py
          python3 zebar/generate-palettes.py
          python3 windhawk/taskbar/generate.py

      - name: Check generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Validate assets and documentation
        run: python3 scripts/validate.py

      - name: Validate PowerShell syntax
        run: |
          pwsh -NoProfile -Command '
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_ }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          '
